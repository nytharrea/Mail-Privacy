name: Set up pinned Rust toolchain
description: Installs the Rust toolchain pinned in rust-toolchain.toml and any extra targets.

inputs:
  targets:
    description: Space-separated Rust targets to add to the pinned toolchain
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install pinned toolchain
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
        test -n "${channel}"
        rustup toolchain install "${channel}" --profile minimal --component rustfmt --component clippy --no-self-update
        if [ -n "${TARGETS}" ]; then
          rustup target add --toolchain "${channel}" ${TARGETS}
        fi
        rustc --version
        cargo --version
