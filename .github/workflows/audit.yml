name: Dependency audit

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "Cargo.toml"
      - "**/Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit (advisory only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Cargo.lock against the RustSec advisory database
        run: cargo audit
