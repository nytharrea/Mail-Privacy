name: Mailx Android Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (leave default for rolling nightly)"
        required: false
        default: "nightly"
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: mailx-android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  JAVA_VERSION: "27"
  NDK_VERSION: "30.0.16248370"
  BUILD_TOOLS_VERSION: "37.0.0"

jobs:
  verify:
    name: Verify Rust workspace
    uses: ./.github/workflows/rust-checks.yml

  mailx-android-release:
    name: "Mailx Android Release"
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Checkout Mailx Android"
        uses: actions/checkout@v7

      - name: "Set up JDK"
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: "Set up Gradle"
        uses: gradle/actions/setup-gradle@v6

      - name: "Set up pinned Rust toolchain"
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: "Cache Rust & Gradle"
        uses: Swatinem/rust-cache@v2

      - name: "Install Android SDK API 37 & NDK"
        shell: bash
        run: |
          set -euo pipefail

          # sdkmanager may close stdin after the last license prompt. A SIGPIPE
          # from `yes` is expected; preserve sdkmanager's status instead.
          set +o pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses
          set -o pipefail

          # Android 17 preview is published as android-37.0 by the SDK repo.
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "ndk;${NDK_VERSION}"

          test -f "${ANDROID_HOME}/platforms/android-37.0/android.jar"
          if [ ! -e "${ANDROID_HOME}/platforms/android-37" ]; then
            ln -s android-37.0 "${ANDROID_HOME}/platforms/android-37"
          fi
          test -f "${ANDROID_HOME}/platforms/android-37/android.jar"

          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: "Install cargo-ndk"
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: "Build Mailx Rust Core (UniFFI)"
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -t x86 \
            -o android-app/app/src/main/jniLibs \
            build --release -p mailx-core --features "network,uniffi"

      - name: "Verify 16 KB ELF alignment (Rust libraries)"
        run: bash scripts/check-elf-alignment.sh android-app/app/src/main/jniLibs

      # Keep Cargo release strip disabled: UniFFI bindgen reads component metadata
      # from the compiled cdylib. Stripping symbols before this step removes it.
      - name: "Generate UniFFI Kotlin bindings"
        uses: ./.github/actions/generate-uniffi-bindings
        with:
          library: android-app/app/src/main/jniLibs/arm64-v8a/libmailx_core.so
          out-dir: android-app/app/src/main/java

      - name: "Configure Release Keystore"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" || -z "${KEYSTORE_PASSWORD}" || -z "${KEY_ALIAS}" ]]; then
            echo "::error::Release signing secrets are missing. Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS; refusing to create a predictable fallback signing key."
            exit 1
          fi
          KS_PATH="${RUNNER_TEMP}/release-signing.jks"
          printf '%s' "${KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > "${KS_PATH}"
          KS_PASS="${KEYSTORE_PASSWORD}"
          K_ALIAS="${KEY_ALIAS}"
          K_PASS="${KEY_PASSWORD:-${KEYSTORE_PASSWORD}}"
          printf "storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "${KS_PATH}" "${KS_PASS}" "${K_ALIAS}" "${K_PASS}" > android-app/keystore.properties

      - name: "Prepare Gradle Wrapper"
        run: chmod +x android-app/gradlew

      - name: "Build Signed Mailx APKs"
        working-directory: android-app
        run: bash ./gradlew assembleRelease --no-daemon --stacktrace

      - name: "Verify packaged native libraries"
        run: bash scripts/check-elf-alignment.sh android-app/app/build/outputs/apk/release/*.apk

      - name: "Verify APK Alignment & Signature"
        run: |
          BT_DIR="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}"
          test -x "${BT_DIR}/zipalign"
          test -x "${BT_DIR}/apksigner"
          ZIPALIGN="${BT_DIR}/zipalign"
          APKSIGNER="${BT_DIR}/apksigner"
          mkdir -p dist-apks
          for apk in android-app/app/build/outputs/apk/release/*.apk; do
            echo "=== Verifying 16 KB zipalign for ${apk} ==="
            "${ZIPALIGN}" -c -v -P 16 4 "${apk}"
            echo "=== Verifying APK Signature & Printing Certificate SHA-256 ==="
            "${APKSIGNER}" verify --verbose --print-certs "${apk}"
            cp "${apk}" dist-apks/
          done
          (cd dist-apks && sha256sum *.apk > SHA256SUMS.txt)
          cat dist-apks/SHA256SUMS.txt

      - name: "Publish Mailx GitHub Release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "${REF_TYPE}" = "tag" ] && [ -n "${REF_NAME}" ]; then
            TAG_NAME="${REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            TAG_NAME="${INPUT_TAG}"
          else
            TAG_NAME="nightly"
          fi
          if [ "${TAG_NAME}" = "nightly" ]; then
            RELEASE_TITLE="Mailx Android (Nightly Build)"
            RELEASE_NOTES="16 KB aligned, multi-ABI (arm64-v8a, armeabi-v7a, x86_64, x86), signed automatic build of commit ${COMMIT_SHA}. Verify downloads against SHA256SUMS.txt."
            PRERELEASE_ARGS=(--prerelease)
          else
            RELEASE_TITLE="Mailx Android ${TAG_NAME}"
            RELEASE_NOTES=""
            PRERELEASE_ARGS=()
          fi

          # Do not use `create || upload`: that masks unrelated create failures
          # as if the release already existed. Check existence explicitly.
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists; replacing matching assets."
            gh release upload "${TAG_NAME}" dist-apks/* --clobber
            if [ "${TAG_NAME}" = "nightly" ]; then
              gh release edit "${TAG_NAME}" \
                --title "${RELEASE_TITLE}" \
                --notes "${RELEASE_NOTES}" \
                --prerelease
            fi
          else
            if [ "${TAG_NAME}" = "nightly" ]; then
              gh release create "${TAG_NAME}" dist-apks/* \
                --title "${RELEASE_TITLE}" \
                --notes "${RELEASE_NOTES}" \
                "${PRERELEASE_ARGS[@]}"
            else
              gh release create "${TAG_NAME}" dist-apks/* \
                --title "${RELEASE_TITLE}" \
                --generate-notes
            fi
          fi
