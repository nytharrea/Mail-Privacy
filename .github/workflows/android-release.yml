name: Mailx Android Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (leave default for rolling nightly)"
        required: false
        default: "nightly"
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

env:
  JAVA_VERSION: "27"
  NDK_VERSION: "30.0.16248370"
  BUILD_TOOLS_VERSION: "36.0.0"

jobs:
  mailx-android-release:
    name: "Mailx Android Release"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Mailx Android"
        uses: actions/checkout@v5

      - name: "Set up JDK"
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: "Set up Gradle"
        uses: gradle/actions/setup-gradle@v6

      - name: "Install Rust Toolchain"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: "Cache Rust & Gradle"
        uses: Swatinem/rust-cache@v2

      - name: "Install Android SDK & NDK"
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          if [ ! -d "${ANDROID_HOME}/ndk/${NDK_VERSION}" ]; then
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"
          fi
          if [ ! -d "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}" ]; then
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "build-tools;${BUILD_TOOLS_VERSION}" || true
          fi
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;${BUILD_TOOLS_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: "Install cargo-ndk"
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: "Build Mailx Rust Core (JNI)"
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -t x86 \
            -o android-app/app/src/main/jniLibs \
            build --release -p mailx-core --features "network,jni,uniffi"

      # Keep Cargo release strip disabled: UniFFI bindgen reads component metadata
      # from the compiled cdylib. Stripping symbols before this step removes it.
      - name: Generate UniFFI Kotlin bindings
        run: |
          cargo install uniffi --version 0.32.2 --features cli --locked
          uniffi-bindgen generate --library android-app/app/src/main/jniLibs/arm64-v8a/libmailx_core.so \
            --language kotlin \
            --out-dir android-app/app/src/main/java

      - name: "Verify 16 KB ELF Alignment"
        run: |
          OBJDUMP="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          mapfile -d '' SO_FILES < <(find android-app/app/src/main/jniLibs -type f -name "*.so" -print0)
          if [ "${#SO_FILES[@]}" -eq 0 ]; then
            echo "ERROR - no native shared libraries found"
            exit 1
          fi
          for so_file in "${SO_FILES[@]}"; do
            echo "Checking 16 KB ELF LOAD alignment for ${so_file}"
            LOAD_HEADERS=$("${OBJDUMP}" -p "${so_file}" | awk '/LOAD/ { print $NF }')
            if [ -z "${LOAD_HEADERS}" ]; then
              echo "ERROR - no ELF LOAD segments found in ${so_file}"
              exit 1
            fi
            while IFS= read -r alignment; do
              if ! [[ "${alignment}" =~ ^2\*\*(14|15|16)$ ]]; then
                echo "ERROR - ${so_file} has unsupported LOAD alignment: ${alignment}"
                exit 1
              fi
            done <<< "${LOAD_HEADERS}"
          done

      - name: "Configure Release Keystore"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" || -z "${KEYSTORE_PASSWORD}" || -z "${KEY_ALIAS}" ]]; then
            echo "::error::Release signing secrets are missing. Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS; refusing to create a predictable fallback signing key."
            exit 1
          fi
          KS_PATH="${RUNNER_TEMP}/release-signing.jks"
          printf '%s' "${KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > "${KS_PATH}"
          KS_PASS="${KEYSTORE_PASSWORD}"
          K_ALIAS="${KEY_ALIAS}"
          K_PASS="${KEY_PASSWORD:-${KEYSTORE_PASSWORD}}"
          printf "storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "${KS_PATH}" "${KS_PASS}" "${K_ALIAS}" "${K_PASS}" > android-app/keystore.properties

      - name: "Build Signed Mailx APKs"
        working-directory: android-app
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: "Verify APK Alignment & Signature"
        run: |
          BT_DIR="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}"
          test -x "${BT_DIR}/zipalign"
          test -x "${BT_DIR}/apksigner"
          ZIPALIGN="${BT_DIR}/zipalign"
          APKSIGNER="${BT_DIR}/apksigner"
          mkdir -p dist-apks
          for apk in android-app/app/build/outputs/apk/release/*.apk; do
            echo "=== Verifying 16 KB zipalign for ${apk} ==="
            "${ZIPALIGN}" -c -v -P 16 4 "${apk}"
            echo "=== Verifying APK Signature & Printing Certificate SHA-256 ==="
            "${APKSIGNER}" verify --verbose --print-certs "${apk}"
            cp "${apk}" dist-apks/
          done

      - name: "Publish Mailx GitHub Release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${REF_TYPE}" = "tag" ] && [ -n "${REF_NAME}" ]; then
            TAG_NAME="${REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            TAG_NAME="${INPUT_TAG}"
          else
            TAG_NAME="nightly"
          fi
          if [ "${TAG_NAME}" = "nightly" ]; then
            gh release create nightly dist-apks/*.apk \
              --title "Mailx Android (Nightly Build)" \
              --notes "16 KB aligned and multi-ABI (arm64-v8a, armeabi-v7a, x86_64, x86) signed automatic build (Material 3 Expressive 1.5.0 & Compose BOM 2026.09.00)." \
              --prerelease || gh release upload nightly dist-apks/*.apk --clobber
          else
            gh release create "${TAG_NAME}" dist-apks/*.apk \
              --title "Mailx Android ${TAG_NAME}" \
              --generate-notes || gh release upload "${TAG_NAME}" dist-apks/*.apk --clobber
          fi
