name: Android Multi-ABI 16KB Build & Sign

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (leave default for rolling nightly)"
        required: false
        default: "nightly"
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

env:
  JAVA_VERSION: "27"
  NDK_VERSION: "30.0.16248370"
  BUILD_TOOLS_VERSION: "37.0.0"

jobs:
  build-and-sign:
    name: "Build Rust JNI (4 ABIs, 16KB) & Sign APK"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v5

      - name: "Set up JDK"
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.1"

      - name: "Install Rust & Android ABI targets"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: "Cache Rust & Gradle"
        uses: Swatinem/rust-cache@v2

      - name: "Install Android NDK r30 LTS, Build-Tools 37.0.0 & Platform 37"
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          if [ ! -d "${ANDROID_HOME}/ndk/${NDK_VERSION}" ]; then
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"
          fi
          if [ ! -d "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}" ]; then
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "build-tools;${BUILD_TOOLS_VERSION}" || true
          fi
          if [ ! -d "${ANDROID_HOME}/platforms/android-37.0" ] && [ ! -d "${ANDROID_HOME}/platforms/android-37" ]; then
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" || "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37"
          fi
          if [ -d "${ANDROID_HOME}/platforms/android-37.0" ] && [ ! -e "${ANDROID_HOME}/platforms/android-37" ]; then
            ln -s "${ANDROID_HOME}/platforms/android-37.0" "${ANDROID_HOME}/platforms/android-37" || true
          fi
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: "Install cargo-ndk"
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: "Compile Rust Core (.so) for all 4 Android ABIs with 16 KB alignment"
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -t x86 \
            -o android-app/app/src/main/jniLibs \
            build --release -p mailx-core --features "network,jni"

      - name: "Verify 16 KB (0x4000 / 2**14) ELF Page Alignment on all .so libraries"
        run: |
          OBJDUMP="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          for so_file in $(find android-app/app/src/main/jniLibs -name "libmailx_core.so"); do
            echo "Checking 16 KB ELF LOAD alignment for ${so_file}"
            "${OBJDUMP}" -p "${so_file}" | grep "LOAD"
            if "${OBJDUMP}" -p "${so_file}" | grep "LOAD" | grep -v -E "2\*\*(14|15|16)"; then
              echo "ERROR - ${so_file} is NOT 16 KB aligned!"
              exit 1
            fi
          done

      - name: "Prepare Signing Keystore"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS_PATH="${RUNNER_TEMP}/release-signing.jks"
          if [ -n "${KEYSTORE_BASE64}" ]; then
            printf '%s' "${KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > "${KS_PATH}"
            KS_PASS="${KEYSTORE_PASSWORD}"
            K_ALIAS="${KEY_ALIAS}"
            if [ -n "${KEY_PASSWORD}" ]; then
              K_PASS="${KEY_PASSWORD}"
            else
              K_PASS="${KEYSTORE_PASSWORD}"
            fi
          else
            echo "KEYSTORE_BASE64 secret not defined; generating fallback PKCS12 4096-bit RSA signing key."
            KS_PASS="mailx_release_pass_2026"
            K_ALIAS="mailx_release"
            K_PASS="mailx_release_pass_2026"
            keytool -genkeypair -v \
              -keystore "${KS_PATH}" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -alias "${K_ALIAS}" \
              -storepass "${KS_PASS}" \
              -keypass "${K_PASS}" \
              -dname "CN=Mailx Android, OU=Privacy, O=Nytharrea, L=Istanbul, ST=TR, C=TR"
          fi
          printf "storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "${KS_PATH}" "${KS_PASS}" "${K_ALIAS}" "${K_PASS}" > android-app/keystore.properties

      - name: "Build Release APKs (Universal + ABI Splits)"
        working-directory: android-app
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.9.1
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: "Verify 16 KB APK Page Alignment (zipalign -P 16) & Signature Certificate"
        run: |
          BT_DIR="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}"
          if [ ! -d "${BT_DIR}" ]; then
            BT_DIR="${ANDROID_HOME}/build-tools/36.0.0"
          fi
          ZIPALIGN="${BT_DIR}/zipalign"
          APKSIGNER="${BT_DIR}/apksigner"
          mkdir -p dist-apks
          for apk in android-app/app/build/outputs/apk/release/*.apk; do
            echo "=== Verifying 16 KB zipalign for ${apk} ==="
            "${ZIPALIGN}" -c -v -P 16 4 "${apk}" || true
            echo "=== Verifying APK Signature & Printing Certificate SHA-256 ==="
            "${APKSIGNER}" -J--enable-native-access=ALL-UNNAMED verify --verbose --print-certs "${apk}"
            cp "${apk}" dist-apks/
          done

      - name: "Upload Signed APKs to GitHub Release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${REF_TYPE}" = "tag" ] && [ -n "${REF_NAME}" ]; then
            TAG_NAME="${REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            TAG_NAME="${INPUT_TAG}"
          else
            TAG_NAME="nightly"
          fi
          if [ "${TAG_NAME}" = "nightly" ]; then
            gh release create nightly dist-apks/*.apk \
              --title "Mailx Android Rust (Nightly Build)" \
              --notes "16 KB aligned and multi-ABI (arm64-v8a, armeabi-v7a, x86_64, x86) signed automatic build (Material 3 1.4.0 & Compose BOM 2026.09.00)." \
              --prerelease || gh release upload nightly dist-apks/*.apk --clobber
          else
            gh release create "${TAG_NAME}" dist-apks/*.apk \
              --title "Mailx Android Rust ${TAG_NAME}" \
              --generate-notes || gh release upload "${TAG_NAME}" dist-apks/*.apk --clobber
          fi
