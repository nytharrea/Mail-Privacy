name: Mailx Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  rust:
    name: Rust workspace checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format Rust workspace
        run: |
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features -- --nocapture

  android-debug:
    name: Android debug build (all ABIs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "27"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK API 37
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install --channel=3 \\
            "platforms;android-37" \\
            "build-tools;36.0.0" \\
            "ndk;30.0.16248370"

          # Normalize an SDK repository android-37.0 directory if necessary.
          if [ ! -f "${ANDROID_HOME}/platforms/android-37/android.jar" ]; then
            candidate="$(find "${ANDROID_HOME}/platforms" -mindepth 1 -maxdepth 1 \\
              -type d -name 'android-37*' -exec sh -c \
              'for d do [ -f "$d/android.jar" ] && { printf "%s\\n" "$d"; exit 0; }; done; exit 1' sh {} +)"
            if [ -z "$candidate" ]; then
              echo "Android SDK API 37 installed package has no android.jar"
              exit 1
            fi
            ln -s "$(basename "$candidate")" "${ANDROID_HOME}/platforms/android-37"
          fi
          test -f "${ANDROID_HOME}/platforms/android-37/android.jar"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build Rust JNI libraries
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 \
            -o android-app/app/src/main/jniLibs \
            build --release -p mailx-core --features "network,jni,uniffi"

      # Keep Cargo release strip disabled: UniFFI bindgen reads component metadata
      # from the compiled cdylib. Stripping symbols before this step removes it.
      - name: Generate UniFFI Kotlin bindings
        run: |
          cargo install uniffi --version 0.32.2 --features cli --locked
          uniffi-bindgen generate --library android-app/app/src/main/jniLibs/arm64-v8a/libmailx_core.so \
            --language kotlin \
            --no-format \
            --out-dir android-app/app/src/main/java

      - name: Prepare Gradle Wrapper
        run: chmod +x android-app/gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android debug APK
        working-directory: android-app
        run: bash ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Android emulator launch smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            APK="$(find android-app/app/build/outputs/apk/debug -name '*x86_64*debug.apk' -o -name '*universal*debug.apk' | head -n 1)"
            test -n "$APK"
            adb install -r "$APK"
            adb shell monkey -p net.mailx.android.debug 1
            sleep 12
            adb shell pidof net.mailx.android.debug
            if adb logcat -d -t 600 | grep -E 'FATAL EXCEPTION|UnsatisfiedLinkError'; then
              echo "Android startup/JNI crash detected"
              exit 1
            fi
