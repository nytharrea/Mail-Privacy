name: Mailx Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      run_emulator:
        description: "Run the slower Android emulator smoke test"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mailx-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  JAVA_VERSION: "27"
  NDK_VERSION: "30.0.16248370"

jobs:
  rust:
    name: Rust workspace checks
    uses: ./.github/workflows/rust-checks.yml

  android-debug:
    name: Android debug build (arm64-v8a + x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK API 37
        shell: bash
        run: |
          set -euo pipefail

          # Accept SDK licenses. sdkmanager closes stdin after the last prompt;
          # therefore `yes` may receive SIGPIPE. Do not let that benign status
          # override sdkmanager's exit code.
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

          # Android 17 preview is published as android-37.0 by the SDK repo.
          sdkmanager --install --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "ndk;${NDK_VERSION}"

          test -f "${ANDROID_HOME}/platforms/android-37.0/android.jar"
          if [ ! -e "${ANDROID_HOME}/platforms/android-37" ]; then
            ln -s android-37.0 "${ANDROID_HOME}/platforms/android-37"
          fi
          test -f "${ANDROID_HOME}/platforms/android-37/android.jar"

          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Set up pinned Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-linux-android x86_64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build Rust JNI libraries
        run: |
          cargo ndk -t arm64-v8a -t x86_64 \
            -o android-app/app/src/main/jniLibs \
            build --release -p mailx-core --features "network,jni,uniffi"

      - name: Verify 16 KB ELF alignment (Rust libraries)
        run: bash scripts/check-elf-alignment.sh android-app/app/src/main/jniLibs

      # Keep Cargo release strip disabled: UniFFI bindgen reads component metadata
      # from the compiled cdylib. Stripping symbols before this step removes it.
      - name: Generate UniFFI Kotlin bindings
        uses: ./.github/actions/generate-uniffi-bindings
        with:
          library: android-app/app/src/main/jniLibs/arm64-v8a/libmailx_core.so
          out-dir: android-app/app/src/main/java

      - name: Prepare Gradle Wrapper
        run: chmod +x android-app/gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Android debug APK
        working-directory: android-app
        run: bash ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run Android unit tests & compile instrumented tests
        working-directory: android-app
        run: bash ./gradlew testDebugUnitTest assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Verify 16 KB ELF alignment (packaged libraries)
        run: bash scripts/check-elf-alignment.sh android-app/app/build/outputs/apk/debug/*.apk

      # Emulator boot is intentionally opt-in: hosted runners can spend many
      # minutes booting a cold AVD. Normal push/PR CI only builds the APK.
      - name: Android emulator launch smoke test
        if: github.event_name == 'workflow_dispatch' && inputs.run_emulator == true
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            set -euo pipefail
            APK_DIR="$GITHUB_WORKSPACE/android-app/app/build/outputs/apk/debug"
            test -d "$APK_DIR"

            # Prefer the universal APK; fall back to x86_64, then any debug APK.
            APK="$(find "$APK_DIR" -type f -name '*.apk' -print | sort | grep -E 'universal.*debug|x86_64.*debug' | head -n 1 || true)"
            if [ -z "$APK" ]; then
              APK="$(find "$APK_DIR" -type f -name '*.apk' -print | sort | head -n 1 || true)"
            fi
            if [ -z "$APK" ]; then
              echo "No debug APK found under $APK_DIR"
              find "$APK_DIR" -maxdepth 4 -type f -print || true
              exit 1
            fi

            echo "Installing smoke-test APK: $APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell monkey -p net.mailx.android.debug 1
            sleep 8
            adb shell pidof net.mailx.android.debug
            if adb logcat -d -t 2000 | grep -E 'FATAL EXCEPTION|UnsatisfiedLinkError|ExceptionInInitializerError|com\.sun\.jna|core\.uniffi'; then
              echo "Android startup, JNI or UniFFI crash detected"
              exit 1
            fi
