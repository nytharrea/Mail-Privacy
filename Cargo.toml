[workspace]
members = [
    "rust-core",
    "crates/mailx-domain",
    "crates/mailx-utils",
    "crates/mailx-security",
    "crates/mailx-network",
    "crates/mailx-application",
    "crates/mailx-runtime",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
authors = ["nytharrea <kipchak@tutanota.com>"]
repository = "https://github.com/nytharrea/Mail-Privacy"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uniffi = "0.32.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
