[package]
name = "mailx-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "mailx_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["network"]
network = ["mailx-network/network", "mailx-application/network"]
jni = ["dep:jni"]
uniffi = ["dep:uniffi"]

[dependencies]
mailx-domain = { path = "../crates/mailx-domain" }
mailx-utils = { path = "../crates/mailx-utils" }
mailx-security = { path = "../crates/mailx-security" }
mailx-network = { path = "../crates/mailx-network", default-features = false }
mailx-application = { path = "../crates/mailx-application", default-features = false }
mailx-runtime = { path = "../crates/mailx-runtime" }
serde.workspace = true
serde_json.workspace = true
jni = { version = "0.21", optional = true }
uniffi = { workspace = true, optional = true }
thiserror.workspace = true
