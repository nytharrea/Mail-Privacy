[package]
name = "mailx-network"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["network"]
network = ["dep:ureq"]

[dependencies]
mailx-domain = { path = "../mailx-domain" }
mailx-utils = { path = "../mailx-utils" }
serde.workspace = true
serde_json.workspace = true
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "json"], optional = true }
